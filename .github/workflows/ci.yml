name: CI — Test & Build

on:
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Run Tests & Verify Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
        env:
          NODE_ENV: test
          # Ephemeral JWT secret for test environment only
          JWT_SECRET: ci-test-ephemeral-secret-do-not-use-in-production

      - name: Build frontend (Vite)
        run: npm run build
