name: CD — Deploy to Render

on:
  push:
    branches:
      - main
    # Only fires when a PR is merged into main (direct pushes blocked by branch protection)

jobs:
  verify-and-deploy:
    name: Verify & Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binary-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      - name: Run test suite (deploy gate)
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-ephemeral-secret-do-not-use-in-production

      - name: Build frontend (Vite)
        run: npm run build

      - name: Trigger Render Deploy Hook
        if: success()
        run: |
          echo "Triggering deploy to Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render API responded with HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Deploy hook failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Deploy triggered successfully."

      - name: Deploy status summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to Render triggered successfully on merge to main."
          else
            echo "❌ Deployment failed. Check the steps above."
          fi
